[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnmi-diff-net"
version = "0.1.0"
description = "Read-only gNMI config differ with per-path device impact tiers"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nora Lund" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]

[project.scripts]
gnmi-diff = "gnmi_diff.cli:main"

[tool.setuptools]
packages = ["gnmi_diff"]
